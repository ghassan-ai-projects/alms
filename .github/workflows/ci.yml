# GitHub Actions CI for ALMS
#
# Runs on push/PR to main. Uses PostgreSQL service container so
# store-layer integration tests run (those t.Skip("PostgreSQL") tests
# become no-ops in CI without the service container).
#
# Pipeline: tidy → build → vet → lint → test (short) → deadcode → vulncheck
# Cross-compile linux binary at the end (to verify deploy.sh works).
#
# Cost controls:
# - cancel superseded runs for the same branch or pull request
# - cache the pinned developer tools and linter analysis
# - build and upload the Linux artifact only after a push to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25.13"
  GO_TOOLS_VERSION: "v0.47.0"
  GOVULNCHECK_VERSION: "v1.3.0"
  GOLANGCI_LINT_VERSION: "v2.13.1"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "ALMS CI"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alms
          POSTGRES_PASSWORD: alms
          POSTGRES_DB: alms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: go.sum

      # Cache compiled tools so normal runs do not rebuild them from source.
      - name: Cache developer tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ env.GO_TOOLS_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install developer tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/tools/cmd/deadcode@${GO_TOOLS_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      # Persist golangci-lint's own analysis cache across runs.
      - name: Cache golangci-lint analysis
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Tidy
        run: go mod tidy
        env:
          GOPROXY: https://proxy.golang.org,direct

      - name: Build
        run: go build -o /dev/null ./cmd/alms/

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run ./... --timeout=5m

      - name: Test (short)
        run: go test -short -race -count=1 -shuffle=on ./...
        env:
          ALMS_PG_DSN: "postgres://alms:alms@localhost:5432/alms_db?sslmode=disable"

      - name: Deadcode
        run: deadcode -test ./...

      - name: Vulncheck
        run: govulncheck ./...

      - name: Cross-compile linux binary
        if: github.event_name == 'push'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-X main.Version=ci -X main.Commit=$(git rev-parse --short HEAD)" -o bin/alms-linux ./cmd/alms/
          echo "Linux binary size: $(ls -lh bin/alms-linux | awk '{print $5}')"

      - name: Upload linux binary (artifact)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: alms-linux-amd64
          path: bin/alms-linux
          retention-days: 3
